:root{--ink:#e9f6ff;--dim:rgba(210,235,255,.62);--acc:#7ff3ff;--warm:#ffb38a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#010207;overflow:hidden;color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB","CellSerif",system-ui,sans-serif}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab}
#gl:active{cursor:grabbing}
.serif{font-family:"CellSerif","Songti SC","Noto Serif SC",serif}

/* 开场 */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(ellipse at 50% 55%,rgba(10,40,60,.15),rgba(1,2,7,.86) 70%);transition:opacity 1.6s,visibility 1.6s}
body.started #intro{opacity:0;visibility:hidden}
#intro .k{font:600 12px/1 ui-monospace,Menlo,monospace,"CellSerif";letter-spacing:.6em;color:var(--acc);opacity:.8;padding-left:.6em}
#intro h1{margin:0;font-family:"CellSerif",serif;font-size:min(13vw,128px);letter-spacing:.18em;padding-left:.18em;font-weight:700;
  background:linear-gradient(180deg,#fff 10%,#9fe9ff 60%,#4b8cff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(110,220,255,.35))}
#intro p{margin:0;color:var(--dim);font-size:15px;letter-spacing:.3em;padding-left:.3em}
#enter{margin-top:14px;background:transparent;color:var(--ink);border:1px solid rgba(127,243,255,.5);padding:14px 40px;border-radius:40px;
  font:500 14px/1 inherit;letter-spacing:.5em;padding-left:calc(40px + .5em);cursor:pointer;position:relative;overflow:hidden;transition:.4s}
#enter:hover{background:rgba(127,243,255,.12);box-shadow:0 0 40px rgba(127,243,255,.3)}
#intro small{position:absolute;bottom:34px;color:rgba(200,230,255,.38);font-size:12px;letter-spacing:.2em}

/* 章节面板 */
#shade{position:fixed;left:0;bottom:0;width:62vw;height:70vh;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 0% 100%,rgba(1,3,8,.82),rgba(1,3,8,.45) 40%,transparent 70%)}
#panel{position:fixed;left:min(6vw,90px);bottom:min(9vh,90px);width:min(520px,44vw);z-index:5;pointer-events:none}
#panel>*{opacity:0;transform:translateY(16px);transition:opacity .9s,transform 1.1s cubic-bezier(.2,.8,.2,1)}
#panel.on>*{opacity:1;transform:none}
#panel.on>*:nth-child(2){transition-delay:.08s}#panel.on>*:nth-child(3){transition-delay:.16s}#panel.on>*:nth-child(4){transition-delay:.3s}#panel.on>*:nth-child(5){transition-delay:.45s}
#idx{font:500 12px/1 ui-monospace,Menlo,monospace,"CellSerif";letter-spacing:.35em;color:var(--acc);margin-bottom:16px;display:flex;align-items:center;gap:14px}
#idx::after{content:"";flex:0 0 80px;height:1px;background:linear-gradient(90deg,var(--acc),transparent)}
#title{margin:0;font-family:"CellSerif",serif;font-weight:700;font-size:clamp(28px,3.4vw,52px);line-height:1.15;letter-spacing:.04em;text-shadow:0 0 40px rgba(120,220,255,.35)}
#en{margin:10px 0 18px;font:500 11px/1.4 ui-monospace,Menlo,monospace,"CellSerif";letter-spacing:.32em;color:var(--dim)}
#body{margin:0 0 24px;font-size:clamp(13px,1.05vw,16px);line-height:1.95;color:rgba(225,240,255,.82);text-shadow:0 1px 12px rgba(0,0,0,.9)}
#facts{display:flex;gap:28px;flex-wrap:wrap}
#facts div{display:flex;flex-direction:column;gap:7px;padding-left:14px;border-left:1px solid rgba(127,243,255,.35)}
#facts b{font-family:"CellSerif",serif;font-size:clamp(17px,1.5vw,24px);color:#fff;letter-spacing:.02em}
#facts span{font-size:12px;color:var(--dim);letter-spacing:.05em}

/* 导航 */
#nav{position:fixed;right:min(4vw,56px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:6}
#nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:7px 0;color:rgba(210,235,255,.42);font-size:13px;letter-spacing:.12em;transition:color .4s}
#nav button i{font:normal 11px ui-monospace,Menlo,monospace,"CellSerif";opacity:.7}
#nav button::after{content:"";width:18px;height:1px;background:currentColor;transition:width .5s}
#nav button span{opacity:0;transform:translateX(8px);transition:.4s}
#nav:hover button span,#nav button.cur span{opacity:1;transform:none}
#nav button:hover{color:#fff}
#nav button.cur{color:var(--acc)}
#nav button.cur::after{width:44px;box-shadow:0 0 10px var(--acc)}

#ctrl{position:fixed;right:min(4vw,56px);bottom:min(9vh,90px);display:flex;gap:10px;z-index:6}
#ctrl button{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;border:1px solid rgba(200,235,255,.25);display:grid;place-items:center;font-size:14px;color:var(--ink);transition:.3s;backdrop-filter:blur(6px);background:rgba(10,20,30,.25)}
#ctrl button:hover{border-color:var(--acc);box-shadow:0 0 22px rgba(127,243,255,.3)}
body.auto #play{border-color:var(--warm);color:var(--warm)}
#barw{position:fixed;left:0;right:0;bottom:0;height:2px;z-index:6;background:rgba(255,255,255,.04)}
#bar{height:100%;width:0;background:linear-gradient(90deg,transparent,var(--acc));box-shadow:0 0 12px var(--acc)}
#hint{position:fixed;left:min(6vw,90px);top:min(6vh,54px);z-index:6;display:flex;gap:18px;align-items:center;font:500 11px/1 ui-monospace,Menlo,monospace,"CellSerif";letter-spacing:.3em;color:rgba(210,235,255,.5)}
#hint b{font-family:"CellSerif",serif;font-size:15px;letter-spacing:.35em;color:var(--ink)}
#keys{position:fixed;right:min(4vw,56px);top:min(6vh,54px);z-index:6;font-size:11px;color:rgba(210,235,255,.38);letter-spacing:.12em}

/* 3D 标注 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
.lab{position:absolute;left:0;top:0;opacity:0;transition:opacity .8s}
.lab:not(.on){opacity:0!important}
.lab b{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;border:1px solid var(--acc);box-shadow:0 0 12px var(--acc)}
.lab b::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff}
.lab em{position:absolute;left:4px;top:-1px;width:70px;height:1px;background:linear-gradient(90deg,var(--acc),rgba(127,243,255,.2));transform-origin:0 0;transform:rotate(-32deg)}
.lab div{position:absolute;left:62px;top:-58px;white-space:nowrap;display:flex;flex-direction:column;gap:5px;padding:2px 0 0 12px;border-left:1px solid rgba(127,243,255,.5)}
.lab span{font-family:"CellSerif",serif;font-size:16px;letter-spacing:.08em;text-shadow:0 0 14px rgba(0,0,0,.9)}
.lab small{font:500 10px ui-monospace,Menlo,monospace,"CellSerif";letter-spacing:.2em;color:var(--dim);text-transform:uppercase}

#stage{position:fixed;left:50%;top:min(11vh,100px);transform:translateX(-50%);z-index:5;opacity:0;transition:opacity 1s;display:flex;flex-direction:column;align-items:center;gap:8px;width:360px}
#stage b{font-family:"CellSerif",serif;font-size:30px;letter-spacing:.4em;padding-left:.4em}
#stage span{font:500 11px ui-monospace,Menlo,monospace,"CellSerif";letter-spacing:.2em;color:var(--dim)}
#stage i{display:block;height:1px;background:var(--acc);box-shadow:0 0 10px var(--acc);align-self:flex-start;transition:width .2s}

body.still *{transition:none!important}
body.clean #panel,body.clean #nav,body.clean #ctrl,body.clean #hint,body.clean #keys,body.clean #labels{opacity:0;pointer-events:none}
body:not(.started) #panel,body:not(.started) #nav,body:not(.started) #ctrl,body:not(.started) #hint,body:not(.started) #keys,body:not(.started) #labels{opacity:0}
#panel,#nav,#ctrl,#hint,#keys,#labels{transition:opacity 1.2s}
@media (max-width:820px){#panel{width:86vw;bottom:80px}#nav{display:none}#body{font-size:13px}.lab div{display:none}}
</style>
