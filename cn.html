<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中国历史长卷——从文明曙光到今天</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none}
body.idle{cursor:none}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
/* 信箱式等比缩放，不变形 */
#film{display:block;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);background:#000}
#bar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,12px);width:min(92vw,1100px);padding:10px 14px 12px;border-radius:10px;background:rgba(28,24,20,.82);color:#efe6d2;font:13px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-sizing:border-box}
#bar.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#bar .row{display:flex;align-items:center;gap:10px}
#bar button{background:none;border:1px solid rgba(239,230,210,.35);color:#efe6d2;border-radius:6px;padding:3px 9px;font:inherit;cursor:pointer}
#bar button:hover{background:rgba(239,230,210,.12)}
#prog{flex:1;height:6px;background:rgba(239,230,210,.2);border-radius:3px;position:relative;cursor:pointer}
#prog i{position:absolute;left:0;top:0;bottom:0;background:#c8372d;border-radius:3px}
#prog b{position:absolute;top:-3px;width:1px;height:12px;background:rgba(239,230,210,.45)}
#time{min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
#chaps{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
#chaps button{padding:2px 7px;font-size:12px}
#chaps button.on{border-color:#c8372d;color:#fff}
</style>
</head>
<body>
<div id="viewport"><canvas id="film" width="1920" height="1080" aria-label="中国历史长卷"></canvas></div>
<script>
/* ---- js/core.js ---- */
/* =====================================================================
   《中国历史长卷》 core.js — 配置 · 工具 · 性能分级 · Renderer
   引擎沿用自 llm-film：全片是 t 的纯函数 draw(t)，帧间不保存状态。
   ===================================================================== */
'use strict';
const AI = window.AI = {};
AI.CONFIG = {
  W: 1920, H: 1080, DURATION: 240, BPM: 72, LOOP: false,
  AUDIO: { music: null /* 配乐接口：填入纯器乐文件路径即与时间轴同步 */, ambience: true, sfx: true, volume: .8 }
};
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : (x > b ? b : x);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const Ease = {
  o: x => 1 - Math.pow(1 - x, 3), i: x => x * x * x,
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  s: x => x * x * (3 - 2 * x),
  /* 闭式阻尼弹簧：零初速，过冲约 3% */
  sp: x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-7 * x) * (Math.cos(TAU * x) + 7 / TAU * Math.sin(TAU * x))
};
const BEAT = 60 / 72, bt = n => n * BEAT, snap = s => Math.round(s / BEAT) * BEAT;
const env = (t, a, b, fi = .6, fo = .5) => Ease.s(seg(t, a, a + fi)) * (1 - Ease.s(seg(t, b - fo, b)));
function mulberry32(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const W = AI.CONFIG.W, H = AI.CONFIG.H;
/* 字体最多两种：楷 / 宋（标题、诗句）+ 黑体（年代、字幕）。测试渲染器里两者都映射到 Noto */
const KAI = '"Kaiti SC","STKaiti","KaiTi","BiauKai","Songti SC","STSong","SimSun","Noto Serif SC","Noto Serif CJK SC","Noto Sans SC",serif';
const HEI = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC","Noto Sans CJK SC",sans-serif';
const CN = HEI;
const VERM = '#c8372d';                 // 朱红：每章只用在最关键的那个元素上
const vermA = a => `rgba(200,55,45,${a})`;

AI.Perf = {
  /* 三档只降低内部渲染分辨率，画面内容不变 */
  tiers: { high: { res: 1, shadow: true, grain: true }, medium: { res: .8, shadow: true, grain: true }, low: { res: .62, shadow: true, grain: true } },
  name: 'high', cur: null,
  init() {
    const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || 4;
    const mobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || '');
    this.name = (cores >= 8 && mem >= 8 && !mobile) ? 'high' : (cores >= 4 && !mobile) ? 'medium' : 'low';
    this.cur = this.tiers[this.name];
  }
};

AI.Renderer = {
  canvas: null, ctx: null, q: 1, cap: 1,
  init() {
    this.canvas = document.getElementById('film');
    this.ctx = this.canvas.getContext('2d', { alpha: false });
    const g = document.createElement('canvas'); g.width = g.height = 256; const gx = g.getContext('2d');
    const id = gx.createImageData(256, 256), r = mulberry32(9);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255 | 0; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14; }
    gx.putImageData(id, 0, 0); this.grainPat = this.ctx.createPattern(g, 'repeat');
    /* 纸边暗角（暖色，非黑） */
    const v = document.createElement('canvas'); v.width = W / 4; v.height = H / 4; const vx = v.getContext('2d');
    const gr = vx.createRadialGradient(W / 8, H / 8, H / 9, W / 8, H / 8, W / 5.6);
    gr.addColorStop(0, 'rgba(60,35,10,0)'); gr.addColorStop(1, 'rgba(60,35,10,.32)'); vx.fillStyle = gr; vx.fillRect(0, 0, W / 4, H / 4); this.vignette = v;
  },
  setQuality(q) {
    q = clamp(Math.min(q, this.cap, AI.Perf.cur.res), .45, 1); if (Math.abs(q - this.q) < .01) return; this.q = q;
    this.canvas.width = Math.round(W * q); this.canvas.height = Math.round(H * q);
  },
  base(c) { c.setTransform(this.q, 0, 0, this.q, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; },
  post(c, t) {
    this.base(c); c.drawImage(this.vignette, 0, 0, W, H);
    const ox = (hash(Math.floor(t * 24)) * 256) | 0, oy = (hash(Math.floor(t * 24) + 7) * 256) | 0;
    c.fillStyle = this.grainPat; c.translate(-ox, -oy); c.fillRect(ox, oy, W, H); this.base(c);
  }
};
AI.Scenes = [];
AI.scene = s => AI.Scenes.push(s);

</script>
<script>
/* ---- js/text.js ---- */
/* =====================================================================
   Text System — 中文优先 · 正常字体排版（不使用粒子文字）
   每个场景最多：1 个主标题 + 1 行辅助说明 + 少量时间信息
   入场：blur（模糊→清晰）· track（字距收拢）· mask（遮罩揭示）· scale · slide
   ===================================================================== */
AI.Text = {
  native: false, hasFilter: false, gate: 1,   // gate：变形期间由时间轴设置，保证两场景的文字从不同时出现
  init(c) { this.native = 'letterSpacing' in c; this.hasFilter = 'filter' in c; },

  /* 基础绘制：单行文字，支持字距、发光 */
  draw(c, str, x, y, o = {}) {
    const al = (o.alpha ?? 1) * this.gate; if (al <= .003 || !str) return 0;
    c.save();
    c.font = `${o.weight || 400} ${o.size || 32}px ${o.font || CN}`;
    c.textBaseline = 'middle'; c.fillStyle = o.color || '#f2f6ff';
    const w = this.width(c, str, o.spacing || 0);
    const x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;
    // 模糊→清晰：用“离屏投影”做柔化（比 ctx.filter 便宜得多），再与清晰字形交叉淡入
    const k = o.blur > .3 && AI.Perf.cur.shadow ? clamp(o.blur / 12) : 0;
    if (k > 0) {
      c.globalAlpha = clamp(al * k); c.shadowColor = o.color || '#f2f6ff'; c.shadowBlur = o.blur * 2.2; c.shadowOffsetX = 30000;
      this._fill(c, str, x0 - 30000, y, o.spacing || 0); c.shadowOffsetX = 0; c.shadowBlur = 0;
    }
    c.globalAlpha = clamp(al * (1 - k * .9));
    if (o.glow && AI.Perf.cur.shadow) { c.shadowColor = o.glowColor || 'rgba(120,190,255,.6)'; c.shadowBlur = o.glow; }
    this._fill(c, str, x0, y, o.spacing || 0);
    c.restore(); return w;
  },
  width(c, str, sp) {
    if (!sp) return c.measureText(str).width;
    if (this.native) { c.letterSpacing = sp + 'px'; const w = c.measureText(str).width - sp; return w; }
    let w = 0; for (const ch of str) w += c.measureText(ch).width + sp; return w - sp;
  },
  _fill(c, str, x0, y, sp) {
    c.textAlign = 'left';
    if (!sp) { c.fillText(str, x0, y); return; }
    if (this.native) { c.letterSpacing = sp + 'px'; c.fillText(str, x0, y); return; }
    let cx = x0; for (const ch of str) { c.fillText(ch, cx, y); cx += c.measureText(ch).width + sp; }
  },

  /* 主标题：清晰字体 + 入场动画 + 可选光线扫过 */
  title(c, str, lt, a, b, o = {}) {
    const fi = o.fi ?? .7, fo = o.fo ?? .5, e = env(lt, a, b, fi, fo); if (e <= 0) return;
    const p = Ease.o(seg(lt, a, a + (o.dur ?? 1.1))), size = o.size || 120, anim = o.anim || 'blur';
    let x = o.x ?? W / 2, y = o.y ?? H / 2, sp = o.spacing ?? size * .06, blur = 0, sc = 1;
    if (anim === 'blur') blur = (1 - p) * 18;
    if (anim === 'track') sp += (1 - p) * size * .32;
    if (anim === 'scale') sc = lerp(1.12, 1, p);
    if (anim === 'slide') x += (1 - p) * (o.dir ?? 60);
    sp += (lt - a) * (o.drift ?? 0);
    const hue = o.hue ?? 205;
    const opt = { size, weight: o.weight || 700, spacing: sp, alpha: e, color: o.color || '#f6f9ff', glow: AI.Perf.cur.shadow ? (o.glow ?? 14) : 0, glowColor: `hsla(${hue},90%,62%,.35)`, align: o.align, font: o.font, blur };
    c.save();
    if (sc !== 1) { c.translate(x, y); c.scale(sc, sc); c.translate(-x, -y); }
    if (anim === 'mask') {
      c.font = `${opt.weight} ${size}px ${o.font || CN}`; const w = this.width(c, str, sp) + 40;
      const x0 = o.align === 'left' ? x - 20 : o.align === 'right' ? x - w + 20 : x - w / 2;
      c.beginPath(); c.rect(x0, y - size, w * p, size * 2); c.clip();
      if (p < 1) { c.fillStyle = `hsla(${hue},100%,80%,${.8 * e})`; c.fillRect(x0 + w * p - 3, y - size * .62, 3, size * 1.24); }
    }
    this.draw(c, str, x, y, opt);
    c.restore();
    // 光线扫过：同一文字层上的高光（不是第二个文字层）
    if (o.sweep === true) {
      const sw = seg(lt, a + (o.sweepAt ?? .9), a + (o.sweepAt ?? .9) + 1.1); if (sw > 0 && sw < 1) {
        c.save(); c.font = `${opt.weight} ${size}px ${o.font || CN}`; const w = this.width(c, str, sp);
        const x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2, bx = x0 - 120 + (w + 240) * Ease.io(sw);
        c.beginPath(); c.moveTo(bx - 40, y - size); c.lineTo(bx + 30, y - size); c.lineTo(bx - 20, y + size); c.lineTo(bx - 90, y + size); c.closePath(); c.clip();
        this.draw(c, str, x, y, { ...opt, color: '#ffffff', alpha: e * .75 * Math.sin(sw * Math.PI), glow: 30, glowColor: `hsla(${hue},100%,80%,.9)`, blur: 0 });
        c.restore();
      }
    }
  },

  /* 中文副标题 / 说明文字 */
  line(c, str, lt, a, b, o = {}) {
    const e = env(lt, a, b, o.fi ?? .5, o.fo ?? .45); if (e <= 0) return;
    const p = Ease.o(seg(lt, a, a + .8));
    this.draw(c, str, (o.x ?? W / 2), (o.y ?? H / 2 + 110) + (1 - p) * 14, {
      size: o.size || 40, weight: o.weight || 400, spacing: o.spacing ?? 4, alpha: e * (o.alpha ?? 1), color: o.color || '#d6e4f7', align: o.align,
      glow: o.glow ?? 0, glowColor: o.glowColor, blur: (1 - p) * (o.blur ?? 6), font: o.font
    });
  },

  /* 英文辅助层：小号、宽字距、低对比 */
  en(c, str, lt, a, b, o = {}) {
    const e = env(lt, a, b, .6, .45); if (e <= 0) return;
    this.draw(c, str, o.x ?? W / 2, o.y ?? H / 2 + 80, { size: o.size || 20, weight: o.weight || 400, spacing: o.spacing ?? 7, alpha: e * (o.alpha ?? .62), color: o.color || '#9fb6d2', align: o.align, font: SANS });
  },

  /* 年份：纪录片式年份标注（细体大数字 + 引导线） */
  year(c, str, lt, a, b, o = {}) {
    const e = env(lt, a, b, .7, .5); if (e <= 0) return;
    const x = o.x ?? 120, y = o.y ?? 950, hue = o.hue ?? 205, p = Ease.o(seg(lt, a, a + 1));
    c.save(); c.globalAlpha = e; c.strokeStyle = `hsla(${hue},90%,72%,.85)`; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x, y - (o.size || 92) * .78); c.lineTo(x + 110 * p, y - (o.size || 92) * .78); c.stroke(); c.restore();
    this.draw(c, str, x - 4 + (1 - p) * -20, y, { size: o.size || 92, weight: 200, align: 'left', alpha: e, spacing: 3, font: NUMF, glow: 18, glowColor: `hsla(${hue},90%,60%,.45)`, blur: (1 - p) * 8 });
    if (o.label) this.draw(c, o.label, x + 2, y + (o.size || 92) * .62 + 22, { size: 26, weight: 400, align: 'left', alpha: e * .8, spacing: 4, color: '#a9bfdc' });
  },

  /* 流程链：问题 ↓ 思考 ↓ … 逐个点亮 */
  chain(c, items, x, y, lt, a, step, b, o = {}) {
    const vertical = o.vertical ?? false, gap = o.gap ?? (vertical ? 92 : 230), n = items.length, size = o.size || 38, hue = o.hue ?? 190;
    const e0 = env(lt, a, b, .4, .5); if (e0 <= 0) return;
    for (let k = 0; k < n; k++) {
      const t0 = a + k * step, on = Ease.o(seg(lt, t0, t0 + .45)), cur = lt >= t0 && lt < t0 + step;
      const px = vertical ? x : x + (k - (n - 1) / 2) * gap, py = vertical ? y + (k - (n - 1) / 2) * gap : y;
      if (k > 0) {
        const qx = vertical ? x : x + (k - 1 - (n - 1) / 2) * gap, qy = vertical ? y + (k - 1 - (n - 1) / 2) * gap : y, g = Ease.o(seg(lt, t0 - .25, t0 + .1));
        c.save(); c.globalAlpha = e0 * .8; c.strokeStyle = `hsla(${hue},90%,72%,.8)`; c.lineWidth = 2; c.beginPath();
        if (vertical) { const y1 = qy + size * .75, y2 = py - size * .75; c.moveTo(x, y1); c.lineTo(x, lerp(y1, y2, g)); if (g > .9) { c.moveTo(x - 7, y2 - 9); c.lineTo(x, y2); c.lineTo(x + 7, y2 - 9); } }
        else { const x1 = qx + gap * .32, x2 = px - gap * .32; c.moveTo(x1, y); c.lineTo(lerp(x1, x2, g), y); if (g > .9) { c.moveTo(x2 - 10, y - 7); c.lineTo(x2, y); c.lineTo(x2 - 10, y + 7); } }
        c.stroke(); c.restore();
      }
      if (on <= 0) continue;
      this.draw(c, items[k], px, py, { size, weight: cur || k === n - 1 && lt > t0 ? 700 : 500, alpha: e0 * on * (cur || lt > a + n * step ? 1 : .72), color: cur ? '#ffffff' : '#c9dcf2', glow: cur ? 22 : 0, glowColor: `hsla(${hue},100%,60%,.7)`, spacing: 4, blur: (1 - on) * 6 });
    }
  }
};

</script>
<script>
/* ---- js/audio.js ---- */
/* =====================================================================
   Audio — 无配乐、无旁白。卡在拍点上的音效由 Web Audio 合成：
   水声、刻刀、竹简、驼铃、帆、汽笛、列车。音频失败不影响画面。
   配乐接口：AI.CONFIG.AUDIO.music 指向纯器乐文件即与时间轴同步播放。
   ===================================================================== */
AI.Audio = {
  ctx: null, on: false, last: -1, cues: [], music: null, coarse: false,
  init(offline) {
    this.cues = [];
    for (const s of AI.Scenes) for (const q of (s.cues || [])) this.cues.push([s.start + q[0], q[1], q[2] ?? 1]);
    this.cues.sort((a, b) => a[0] - b[0]);
    const A = AI.CONFIG.AUDIO;
    try { if (A.music && !offline && typeof Audio !== 'undefined') { this.music = new Audio(A.music); this.music.preload = 'auto'; this.music.volume = A.volume; } } catch (e) { this.music = null; }
    try {
      const AC = offline ? null : (window.AudioContext || window.webkitAudioContext);
      const c = this.ctx = offline || (AC ? new AC() : null); if (!c) return;
      this.master = c.createGain(); this.master.gain.value = .0001;
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
      this.master.connect(comp); comp.connect(c.destination);
      const len = c.sampleRate * 2, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0), r = mulberry32(5);
      for (let i = 0; i < len; i++) d[i] = r() * 2 - 1; this.noise = nb;
      /* 极轻的环境底噪（风 / 水），无音高，不是配乐 */
      const src = c.createBufferSource(); src.buffer = nb; src.loop = true; this.ambF = c.createBiquadFilter(); this.ambF.type = 'lowpass'; this.ambF.frequency.value = 420;
      this.amb = c.createGain(); this.amb.gain.value = .0001; src.connect(this.ambF); this.ambF.connect(this.amb); this.amb.connect(this.master); src.start();
      this.on = !!(A.ambience || A.sfx);
    } catch (e) { this.on = false; }
  },
  unlock() {
    try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); if (this.music && this.music.paused && AI.Player.playing) { this.music.currentTime = AI.Timeline.t; this.music.play().catch(() => {}); } } catch (e) {}
  },
  resync(t) { this.last = t - .001; if (this.music) { try { this.music.currentTime = t; } catch (e) {} } },
  _T(p, v, now, tau) { if (this.coarse) p.linearRampToValueAtTime(v, now + .25); else p.setTargetAtTime(v, now, tau); },
  update(t, playing, nowOverride) {
    try {
      if (this.music) { if (playing && this.music.paused && this.ctx && this.ctx.state === 'running') { this.music.currentTime = t; this.music.play().catch(() => {}); } if (!playing && !this.music.paused) this.music.pause(); }
      if (!this.on || !this.ctx) return;
      const c = this.ctx, now = nowOverride ?? c.currentTime, A = AI.CONFIG.AUDIO;
      if (!this.coarse || (this._cnt = (this._cnt || 0) + 1) % 15 === 1) {
        this._T(this.master.gain, Math.max(1e-4, playing ? A.volume * (1 - seg(t, 236, 240)) : 0), now, .1);
        this._T(this.amb.gain, Math.max(1e-4, A.ambience && !A.music ? .025 : 1e-4), now, .6);
      }
      if (!playing || !A.sfx) { this.last = t; return; }
      if (this.last < 0 || t < this.last || t - this.last > 1) this.last = t - .001;
      const upto = t + .12;
      for (const q of this.cues) if (q[0] > this.last && q[0] <= upto) this.fx(q[1], now + (q[0] - t), q[2]);
      this.last = upto;
    } catch (e) { this.on = false; }
  },
  _g(when, a, peak, d) { const g = this.ctx.createGain(); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(peak, when + a); g.gain.exponentialRampToValueAtTime(.0001, when + a + d); g.connect(this.master); return g; },
  _n(when, dur, type, f, q, peak, att = .002) { const c = this.ctx, s = c.createBufferSource(); s.buffer = this.noise; const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; s.connect(fl); fl.connect(this._g(when, att, peak, dur)); s.start(Math.max(when, 0), hash(when) * 1.5); s.stop(when + att + dur + .05); return fl; },
  _o(when, f, type, dur, peak, f2, att = .004) { const c = this.ctx, o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, when); if (f2) o.frequency.exponentialRampToValueAtTime(f2, when + dur); o.connect(this._g(when, att, peak, dur)); o.start(Math.max(when, 0)); o.stop(when + att + dur + .05); return o; },
  fx(type, w, g = 1) {
    if (w < 0) w = this.ctx.currentTime;

        c.fillStyle = 'rgba(46,95,150,.85)'; for (const s of [-1, 1]) for (const yy of [-1, 1]) { const x = s > 0 ? 160 * p : -160 * p - 120 * p, y = yy * 34 - (yy < 0 ? 30 : 0); c.fillRect(x, y, 120 * p, 30); c.strokeRect(x, y, 120 * p, 30); }
        c.restore();
        c.globalAlpha = 1;
      }
      /* 一户人家的窗口 */
      const wa = ON(lt, 11, 99, .9);
      if (wa > 0) {
        const wx = P.d + 120, wy = 420; c.save(); c.globalAlpha = wa * (1 - back);
        c.fillStyle = '#d9cbb0'; c.fillRect(wx - 260, wy - 220, 520, 520); c.strokeStyle = LN; c.lineWidth = 3; c.strokeRect(wx - 260, wy - 220, 520, 520);
        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { if (i === 1 && j === 1) continue; c.fillStyle = hash(i * 5 + j) > .4 ? '#f6d48a' : '#6d7a86'; c.fillRect(wx - 230 + i * 125, wy - 190 + j * 125, 90, 80); }
        const X = wx - 105, Y = wy - 65; c.fillStyle = '#ffe2a0'; c.fillRect(X, Y, 90 * 2.2, 80 * 2.2); c.strokeRect(X, Y, 198, 176);
        c.save(); c.beginPath(); c.rect(X, Y, 198, 176); c.clip(); c.fillStyle = '#c98a4a'; c.fillRect(X + 30, Y + 120, 140, 10);
        K.fig(c, X + 50, Y + 168, 1.3, 'sit', lt * 2, { color: LN }); K.fig(c, X + 150, Y + 168, 1.3, 'sit', lt * 2 + 1, { color: '#8a4a3a', dir: -1 }); K.fig(c, X + 100, Y + 150, .8, 'wave', lt * 2, { color: TEAL });
        c.restore(); c.restore();
      }
      /* 镜头升起，卷面变回开篇那条河（彩陶水波） */
      if (back > 0) {
        c.globalAlpha = back; c.fillStyle = 'rgba(216,176,133,.82)'; c.fillRect(P.d - 1700, -400, 3400, 1800);
        c.strokeStyle = '#2b1b12'; c.lineCap = 'round'; for (let k = -1; k <= 1; k++) { c.lineWidth = 6 - Math.abs(k) * 2; K.curve(c, P.d - 1700, P.d + 1700, x => P.ry(x) - 120 + k * 18 + 6 * Math.sin(x / 40 + lt * 1.2 + k)); c.stroke(); }
        c.globalAlpha = 1;
      }
    }
  });
  }
})();

</script>
<script>
/* ---- js/timeline.js ---- */
/* =====================================================================
   Timeline — 一幅无限展开的手卷
   镜头 X(t)：章内缓慢平移（速度按章设置），章与章之间在 2.4 秒内把下一幅卷面拉到画面中央。
   每章是卷上相邻的一段，裁切在自己的范围内绘制；河流按全局坐标连续，所以跨过接缝也不断。
   draw(t) 是纯函数：画面只由 t 决定。
   ===================================================================== */
AI.Timeline = {
  t: 0, TR: 2.4,
  prep() {
    const S = AI.Scenes; let acc = 0;
    for (const s of S) { s.dur = s.end - s.start; s.d0 = acc; acc += s.v0 * s.dur; }
    for (const s of S) { s.Xmid = this.X((s.start + s.end) / 2); }
    for (let i = 0; i < S.length; i++) { S[i].S0 = i ? this.X(S[i].start) : -1e7; S[i].S1 = i < S.length - 1 ? this.X(S[i].end) : 1e7; }
  },
  /* 镜头中心在卷上的全局 x */
  X(t) {
    const S = AI.Scenes; let x = 0;
    for (let i = 1; i < S.length; i++) x += W * Ease.s(seg(t, S[i].start - this.TR / 2, S[i].start + this.TR / 2));
    for (const s of S) if (t > s.start) x += s.v0 * Math.min(t - s.start, s.dur);
    return x;
  },
  chapterAt(t) { const S = AI.Scenes; for (let i = 0; i < S.length; i++) if (t < S[i].end) return i; return S.length - 1; },
  render(t) {
    const R = AI.Renderer, c = R.ctx, S = AI.Scenes; this.t = t;
    R.base(c);
    const X = this.X(t);
    /* 1 · 纸色：按屏幕竖条取所在章节的纸色，接缝两侧 160px 内渐变 */
    for (let i = 0; i < S.length; i++) { const L = W / 2 + S[i].S0 - X, Rr = W / 2 + S[i].S1 - X; if (Rr < 0 || L > W) continue; c.fillStyle = S[i].paper; c.fillRect(Math.max(0, L), 0, Math.min(W, Rr) - Math.max(0, L), H); }
    for (let i = 1; i < S.length; i++) {
      const sx = W / 2 + S[i].S0 - X; if (sx < -200 || sx > W + 200) continue;
      const g = c.createLinearGradient(sx - 180, 0, sx + 180, 0); g.addColorStop(0, S[i - 1].paper); g.addColorStop(1, S[i].paper); c.fillStyle = g; c.fillRect(sx - 180, 0, 360, H);
    }
    /* 2 · 可见章节的卷面 */
    for (let i = 0; i < S.length; i++) {
      const s = S[i], L = W / 2 + s.S0 - X, Rr = W / 2 + s.S1 - X; if (Rr < 0 || L > W) continue;
      const lt = t - s.start, P = { d: X - s.Xmid, X0: s.Xmid, lt, dur: s.dur, ry: u => riverY(s.Xmid + u) };
      c.save(); c.beginPath(); c.rect(Math.max(L, -2), 0, Math.min(Rr, W + 2) - Math.max(L, -2), H); c.clip();
      const z = s.zoom ? s.zoom(lt) : null;
      if (z && z.z !== 1) { c.translate(z.cx, z.cy); c.scale(z.z, z.z); c.translate(-z.cx, -z.cy); }
      c.translate(W / 2 - P.d, 0);
      try { s.draw(c, lt, P); } finally { c.restore(); R.base(c); }
      /* 装裱接缝：细双线（不是转场黑场） */
      if (i > 0 && L > -4 && L < W + 4) { c.globalAlpha = .35; c.fillStyle = '#6b5638'; c.fillRect(L - 3, 0, 1.5, H); c.fillRect(L + 2, 0, 1.5, H); c.globalAlpha = 1; }
    }
    /* 3 · 卷轴上下边：锦缎边随卷面一起移动 */
    AI.K.edges(c, X);
    /* 4 · 文字（屏幕空间）：章名签条 · 年代 · 字幕 */
    const ci = this.chapterAt(t);
    for (const j of [ci - 1, ci, ci + 1]) if (S[j]) AI.K.texts(c, S[j], t - S[j].start);
    R.post(c, t);
    /* 片尾：慢慢淡回纸色（不是黑场） */
    const fo = seg(t, 236.4, 240); if (fo > 0) { R.base(c); c.globalAlpha = Ease.s(fo) * .92; c.fillStyle = '#efe6d2'; c.fillRect(0, 0, W, H); c.globalAlpha = 1; }
    /* 片头：从晨雾里显影 */
    const fi = 1 - seg(t, 0, 2.2); if (fi > 0) { R.base(c); c.globalAlpha = Ease.s(fi) * .95; c.fillStyle = '#ece6da'; c.fillRect(0, 0, W, H); c.globalAlpha = 1; }
    return S[ci];
  }
};
/* 贯穿全片的那条河：全局坐标的纯函数 */
function riverY(gx) { return 742 + 34 * Math.sin(gx / 690) + 18 * Math.sin(gx / 263 + 1.3) + 8 * Math.sin(gx / 97 + .4); }
function hex2(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, p) { const A = hex2(a), B = hex2(b); return `rgb(${A.map((v, k) => Math.round(lerp(v, B[k], p))).join(',')})`; }

AI.Player = {
  playing: true, startTs: null, base: 0, last: 0, acc: 0, frames: 0, q: 1,
  start() {
    const loop = ts => { this.frame(ts); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    const kick = () => AI.Audio.unlock();
    ['pointerdown', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, kick, { passive: true }));
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); this.playing ? this.pause() : this.play(); AI.UI && AI.UI.poke(); }
      if (e.code === 'ArrowRight') this.seek(AI.Timeline.t + 5, true);
      if (e.code === 'ArrowLeft') this.seek(AI.Timeline.t - 5, true);
      if (e.code === 'KeyL') AI.CONFIG.LOOP = !AI.CONFIG.LOOP;
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (this.playing) this.pause(true); } else if (this._autoPaused) { this._autoPaused = false; this.play(); } });
    AI.Audio.init();
  },
  frame(ts) {
    if (this.startTs === null) { this.startTs = ts; this.last = ts; }
    const dt = ts - this.last; this.last = ts; const D = AI.CONFIG.DURATION;
    let t = this.playing ? this.base + (ts - this.startTs) / 1000 : this.base;
    if (t >= D) { if (AI.CONFIG.LOOP && t >= D + 3) { this.play(0); t = 0; } else t = D - .001; }
    AI.Timeline.render(t);
    AI.Audio.update(t, this.playing && t < D);
    AI.UI && AI.UI.update(t, this.playing);
    if (dt > 0 && dt < 250) { this.acc += dt; this.frames++; }
    if (this.acc > 1500) {
      const avg = this.acc / this.frames; this.acc = 0; this.frames = 0;
      if (avg > 20 && this.q > .6) { this.q = Math.max(.6, this.q - .1); AI.Renderer.setQuality(this.q); }
      else if (avg < 14 && this.q < 1) { this.q = Math.min(1, this.q + .05); AI.Renderer.setQuality(this.q); }
    }
  },
  play(t) { this.base = t !== undefined ? t : AI.Timeline.t; this.startTs = null; this.playing = true; AI.Audio.resync(this.base); },
  pause(auto) { this.base = AI.Timeline.t; this.playing = false; if (auto) this._autoPaused = true; AI.Audio.update(this.base, false); },
  seek(t, keep) { this.base = clamp(t, 0, AI.CONFIG.DURATION - .001); this.startTs = null; if (!keep) this.playing = false; AI.Timeline.render(this.base); AI.Audio.resync(this.base); }
};

</script>
<script>
/* ---- js/ui.js ---- */
/* 播放条：鼠标移动时浮出，2 秒后自动隐藏。进度、章节跳转、重播。空格暂停。 */
AI.UI = {
  init() {
    const S = AI.Scenes, D = AI.CONFIG.DURATION, bar = document.createElement('div'); bar.id = 'bar';
    bar.innerHTML = '<div class="row"><button id="pp">暂停</button><div id="prog"><i></i></div><span id="time"></span><button id="rp">重播</button></div><div id="chaps"></div>';
    document.body.appendChild(bar); this.bar = bar;
    const prog = bar.querySelector('#prog'); this.fill = prog.querySelector('i'); this.time = bar.querySelector('#time'); this.pp = bar.querySelector('#pp');
    S.forEach(s => { if (s.start > 0) { const m = document.createElement('b'); m.style.left = (s.start / D * 100) + '%'; prog.appendChild(m); } });
    this.btns = S.map((s, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + ' ' + s.title.split(' · ')[0]; b.title = s.title; b.onclick = () => { AI.Player.play(s.start + .01); this.poke(); }; bar.querySelector('#chaps').appendChild(b); return b; });
    prog.onclick = e => { const r = prog.getBoundingClientRect(); AI.Player.play(clamp((e.clientX - r.left) / r.width) * D); this.poke(); };
    this.pp.onclick = () => { AI.Player.playing ? AI.Player.pause() : AI.Player.play(); this.poke(); };
    bar.querySelector('#rp').onclick = () => { AI.Player.play(0); this.poke(); };
    bar.addEventListener('mousemove', e => e.stopPropagation());
    bar.addEventListener('mouseenter', () => { this.hover = true; this.poke(); });
    bar.addEventListener('mouseleave', () => { this.hover = false; this.poke(); });
    document.addEventListener('mousemove', () => this.poke());
    document.addEventListener('touchstart', () => this.poke(), { passive: true });
    document.body.classList.add('idle');
  },
  poke() {
    this.bar.classList.add('show'); document.body.classList.remove('idle'); clearTimeout(this.tm);
    this.tm = setTimeout(() => { if (this.hover) return this.poke(); this.bar.classList.remove('show'); document.body.classList.add('idle'); }, 2000);
  },
  update(t, playing) {
    if (!this.bar || !this.bar.classList.contains('show')) return;
    const D = AI.CONFIG.DURATION, f = m => Math.floor(m / 60) + ':' + String(Math.floor(m % 60)).padStart(2, '0');
    this.fill.style.width = (t / D * 100) + '%'; this.time.textContent = f(t) + ' / ' + f(D); this.pp.textContent = playing ? '暂停' : '播放';
    const ci = AI.Timeline.chapterAt(t); this.btns.forEach((b, i) => b.classList.toggle('on', i === ci));
  }
};

</script>
<script>
/* ---- main.js ---- */
/* main — 初始化并自动播放。空格：暂停 / 继续 · ← →：快退 / 快进 5 秒 · L：循环。调试：__seek(t) */
(function () {
  AI.Perf.init(); AI.Renderer.init(); AI.Text.init(AI.Renderer.ctx);
  AI.Scenes.sort((a, b) => a.start - b.start); AI.Timeline.prep();
  const fit = () => {
    const r = AI.Renderer.canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    AI.Renderer.cap = clamp(r.width * dpr / AI.CONFIG.W, .45, 1); AI.Renderer.setQuality(AI.Player.q);
    if (!AI.Player.playing) AI.Timeline.render(AI.Timeline.t);
  };
  window.addEventListener('resize', fit);
  window.__duration = AI.CONFIG.DURATION; window.__seek = t => AI.Player.seek(t); window.__play = t => AI.Player.play(t); window.__pause = () => AI.Player.pause();
  const go = () => { fit(); AI.UI.init(); AI.Player.start(); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go, go);
})();

</script>
